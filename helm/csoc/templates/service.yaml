apiVersion: v1
kind: Service
metadata:
  name: {{ include "csoc.fullname" . }}
  labels:
    {{- include "csoc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "csoc.selectorLabels" . | nindent 4 }}

  ports:
    # Frontend
    - name: frontend
      port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.targetPort }}
      protocol: TCP

    # API
    - name: api
      port: {{ .Values.service.api.port }}
      targetPort: {{ .Values.service.api.targetPort }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "csoc.fullname" . }}-grpc
  {{- with .Values.service.grpc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "csoc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.grpc.type }}
  {{- with .Values.service.grpc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "csoc.selectorLabels" . | nindent 4 }}

  ports:
    # gRPC
    - name: grpc
      port: {{ .Values.service.grpc.port }}
      targetPort: {{ .Values.service.grpc.targetPort }}
      protocol: TCP
