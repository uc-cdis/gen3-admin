apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csoc.fullname" . }}
  labels:
    {{- include "csoc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "csoc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "csoc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "csoc.serviceAccountName" .) }}
      {{- with .Values.frontend.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        # - name: {{ .Values.volumes.config.name }}
        #   configMap:
        #     name: {{ .Values.volumes.config.configMapName }}
        - name: {{ .Values.volumes.data.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.name }}

      containers:
        # ================= API =================
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: {{ .Values.api.workingDir }}

          {{ with .Values.api.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}

          ports:
            - containerPort: {{ .Values.api.ports.http }}
            - containerPort: {{ .Values.api.ports.grpc }}

          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          volumeMounts:
            {{- toYaml .Values.api.volumeMounts | nindent 12 }}

        # ================= FRONTEND =================
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.frontend.ports.http }}

          livenessProbe:
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}

          env:
            {{- range $key, $value := .Values.frontend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- /*
              NextAuth secrets are sourced from a Secret rather than values.yaml so
              they are never committed as plaintext defaults. Fails the render when
              unset so a deployment cannot silently fall back to a shared value.
            */}}
            {{- if .Values.frontend.existingSecret }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.existingSecret }}
                  key: {{ .Values.frontend.existingSecretKeys.nextauthSecret | default "NEXTAUTH_SECRET" }}
            - name: NEXTAUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.frontend.existingSecret }}
                  key: {{ .Values.frontend.existingSecretKeys.nextauthJwtSecret | default "NEXTAUTH_JWT_SECRET" }}
            {{- else if not .Values.frontend.allowInsecureDevSecrets }}
            {{- fail "frontend.existingSecret must be set to a Secret containing NEXTAUTH_SECRET and NEXTAUTH_JWT_SECRET. For throwaway local clusters only, set frontend.allowInsecureDevSecrets=true to generate random per-release values instead." }}
            {{- else }}
            - name: NEXTAUTH_SECRET
              value: {{ randAlphaNum 32 | quote }}
            - name: NEXTAUTH_JWT_SECRET
              value: {{ randAlphaNum 32 | quote }}
            {{- end }}

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
